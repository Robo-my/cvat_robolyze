services:
  nuclio:
    container_name: nuclio
    image: quay.io/nuclio/dashboard:1.16.3-amd64
    restart: always
    networks:
      - cvat
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      http_proxy:
      https_proxy:
      no_proxy: ${no_proxy:-}
      NUCLIO_CHECK_FUNCTION_CONTAINERS_HEALTHINESS: 'true'
      NUCLIO_DASHBOARD_DEFAULT_FUNCTION_MOUNT_MODE: 'volume'
    logging:
      driver: "json-file"
      options:
        max-size: 100m
        max-file: "3"

  cvat_server:
    environment:
      CVAT_SERVERLESS: 1
      # direct = POST to host.docker.internal:<function port>. Model ports are pinned by
      # add_yolo_model.sh, so they survive restarts. "dashboard" mode breaks after a host
      # reboot: nuclio invokes the container IP recorded at deploy time, and Docker
      # reassigns those IPs on restart.
      CVAT_NUCLIO_INVOKE_METHOD: direct
    extra_hosts:
      - "host.docker.internal:host-gateway"

  cvat_worker_annotation:
    environment:
      CVAT_NUCLIO_INVOKE_METHOD: direct
    extra_hosts:
      - "host.docker.internal:host-gateway"
