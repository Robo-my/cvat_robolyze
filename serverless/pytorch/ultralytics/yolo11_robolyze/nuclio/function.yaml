metadata:
  name: pth-ultralytics-yolo11-robolyze
  namespace: cvat
  annotations:
    name: YOLO11 Robolyze (cracks/potholes/raveling/sw)
    type: detector
    spec: |
      [
        { "id": 0, "name": "cracks", "type": "rectangle" },
        { "id": 1, "name": "potholes", "type": "rectangle" },
        { "id": 2, "name": "raveling", "type": "rectangle" },
        { "id": 3, "name": "sw", "type": "rectangle" }
      ]

spec:
  description: YOLO11 custom model for road surface defects
  runtime: 'python:3.10'
  handler: main:handler
  eventTimeout: 30s

  build:
    image: cvat.pth.ultralytics.yolo11.robolyze
    baseImage: ubuntu:22.04

    directives:
      preCopy:
        - kind: RUN
          value: apt-get update && apt-get install --no-install-recommends -y python3-pip python-is-python3 libgl1 libglib2.0-0 && rm -rf /var/lib/apt/lists/*
        - kind: RUN
          value: pip install --no-cache-dir ultralytics==8.3.40 pillow pyyaml
        - kind: WORKDIR
          value: /opt/nuclio
      postCopy:
        - kind: RUN
          value: ls /opt/nuclio

  triggers:
    myHttpTrigger:
      numWorkers: 2
      kind: 'http'
      workerAvailabilityTimeoutMilliseconds: 10000
      attributes:
        maxRequestBodySize: 33554432 # 32MB

  platform:
    attributes:
      restartPolicy:
        name: always
        maximumRetryCount: 3
      mountMode: volume
